<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar HTML dan CSS</title>
    <style>
        /* 1. CARA BUAT BACKGROUND IMAGE */
        body {
            /* Ganti 'background.jpg' dengan nama/URL file gambar latar belakang Anda */
            background-color: brown; 
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            font-family: sans-serif;
            color: #0a0a0a;
             /* Membuat semua isi kotak sejajar di tengah */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        

        .container {
            background-color: rgba(253, 253, 253, 0.85); /* Kotak putih transparan agar teks terbaca */
            padding: 20px;
            max-width: 600px;
            margin: 50px auto;
            border-radius: 8px;
        }

        /* Mengatur ukuran gambar agar tidak melewati batas kotak */
        img {
            max-width: 50%;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="21.jpg" alt="Deskripsi gambar untuk SEO dan aksesibilitas">
        <!-- 2. CARA BUAT TEXT -->
        <h1>oh jadi ga mau liat</h1>
        <p>iya udah akuu ga paksa😓</p></div>
        <!-- Versi paksa play otomatis (tetapi suara mati di awal sesuai aturan browser) -->
<!-- Lagu langsung berputar otomatis (autoplay) dan berulang terus (loop) -->
<audio autoplay>
    <source src="sed.mp3" type="audio/mpeg">
</audio>



</body>
</html>

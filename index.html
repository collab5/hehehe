<!DOCTYPE html>
<html lang="en">
<head>
   <title>SURAT KHUSUS</title>
<style>
    :root {
font-size: 2rem;
}

*,
*::before,
*::after {
box-sizing: border-box;
}

body {
color: #eee;
background-color: #362f42;
margin: 0;
min-height: 100vh;
}

.center {
display: grid;
place-content: center;
position: absolute;
inset: 0;
}

.iso {
--iso: scaleX(0.866025) rotateZ(30deg) skewX(150deg);
max-width: 45ch;
transform: var(--iso);
}

.button-container {
display: flex;
gap: 1.5em;
}

.btn {
--size: 1em;
--magic: 0.866025;
--shift: translate(
calc(-1 * var(--size)),
calc(-1 * var(--size) * var(--magic))
);
position: relative;
font: inherit;
color: #eee;
background-color: #4a06a3;
border: none;
padding: 0;
cursor: pointer;
transform: var(--shift);
transition: transform 400ms ease;
}

.content {
background-color: #222;
padding: 1em;
}

:is(.side, .front) {
position: absolute;
transition: transform 400ms ease;
z-index: 1;
}

.front {
inset: 0 calc(var(--size) * -2) 0 100%;
background-color: #262626;
transform-origin: center left;
transform: skewY(41.25deg) scaleX(0.5);
}

.side {
inset: 100% 0 calc(-2 * var(--size) * var(--magic)) 0;
background-color: #161616;
transform-origin: top center;
transform: skewX(49deg) scaleY(0.5);
}

.btn:hover {
--shift: translate(
calc(-2 * var(--size)),
calc(-2 * var(--size) * var(--magic))
);
}

.btn:active {
--shift: translate(0, 0);
}

.btn:hover .front {
transform: skewY(41.25deg) scaleX(1);
}

.btn:hover .side {
transform: skewX(49deg) scaleY(1);
}

.btn:active .front {
transform: skewY(41.25deg) scaleX(0);
}

.btn:active .side {
transform: skewX(49deg) scaleY(0);
}

</style>
</head>
<body>
<main class="center">
  <section class="iso">
     <h1>ADA SURAT</h1>
    <div class="button-container">
      <button class="btn" onclick="window.location.href='utama.html'">
        <div class="content">mau buka</div>
        <div class="side"></div>
        <div class="front"></div>
      </button>

      <button class="btn" onclick="window.location.href='tidak_mau.html'">
        <div class="content">atau gak</div>
        <div class="side"></div>
        <div class="front"></div>
      </button>
    </div>
  </section>
</main>

</body>
</html>
